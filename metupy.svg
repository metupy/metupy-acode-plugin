<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <style>
      .metupy-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #fff; }
      .metupy-bg { fill: #3776ab; }
    </style>
  </defs>
  
  <!-- Background -->
  <circle cx="64" cy="64" r="64" class="metupy-bg"/>
  
  <!-- Python-like symbol with M -->
  <g transform="translate(20, 20)">
    <!-- M letter -->
    <text x="20" y="50" class="metupy-text">M</text>
  </g>
  
  <!-- Additional design elements -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
</svg>